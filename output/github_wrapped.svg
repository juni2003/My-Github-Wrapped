<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#9b5cff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #e6f1ff; }
      .label { font: 600 13px 'Segoe UI', sans-serif; fill: #9fb3c8; letter-spacing: 0.5px; }
      .value { font: 700 18px 'Segoe UI', sans-serif; fill: #e6f1ff; }
      .neon { fill: url(#neon); filter: url(#glow); }
      .card { fill: #0f1726; stroke: #1f2a44; stroke-width: 1.2; }
      .mini { font: 500 13px 'Segoe UI', sans-serif; fill: #cfe3ff; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="390" rx="18" class="card"/>

  <text x="40" y="65" class="title">
    <tspan class="neon">GitHub Wrapped</tspan> — juni2003
  </text>

  <!-- Stat Cards -->
  <rect x="40" y="90" width="180" height="90" rx="12" class="card"/>
  <text x="55" y="118" class="label">TOTAL REPOS</text>
  <text x="55" y="150" class="value">26</text>

  <rect x="235" y="90" width="180" height="90" rx="12" class="card"/>
  <text x="250" y="118" class="label">TOTAL COMMITS</text>
  <text x="250" y="150" class="value">591</text>

  <rect x="430" y="90" width="180" height="90" rx="12" class="card"/>
  <text x="445" y="118" class="label">PULL REQUESTS</text>
  <text x="445" y="150" class="value">24</text>

  <rect x="625" y="90" width="230" height="90" rx="12" class="card"/>
  <text x="640" y="118" class="label">ISSUES + STARS</text>
  <text x="640" y="150" class="value">2 issues • ★ 38</text>

  <!-- Busiest Day -->
  <rect x="40" y="195" width="380" height="70" rx="12" class="card"/>
  <text x="55" y="222" class="label">BUSIEST DAY (RECENT)</text>
  <text x="55" y="248" class="value">Wednesday</text>

  <!-- Top Repos -->
  <rect x="40" y="275" width="815" height="60" rx="12" class="card"/>
  <text x="55" y="300" class="label">TOP REPOS</text>
  <text x="55" y="323" class="mini">AI-Meme-Generator, Buildable-ML-DL-Fellowship, Flappy-Bird-2-player-game, Junaid-Portfolio, juni2003</text>

  <!-- Top Languages -->
  <rect x="40" y="345" width="815" height="60" rx="12" class="card"/>
  <text x="55" y="370" class="label">TOP LANGUAGES</text>
  <text x="55" y="393" class="mini">Python, TypeScript, Jupyter Notebook, Cython, JavaScript</text>
</svg>
